name: 功能建议
description: 希望桌宠增加或改进的能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先确认 README 的「已知盲区」中没有包含该场景，并尽量说明它解决了什么实际使用问题。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 痛点
      description: 在什么场景下需要这个能力？现在的做法为什么不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述你希望看到的行为；涉及状态检测时请附上可观察的 DOM 依据。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其它可行的实现或替代做法？
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考链接或其它上下文。
    validations:
      required: false
